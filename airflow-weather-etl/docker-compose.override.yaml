# Adds a separate Postgres database for the weather data.
# Docker Compose loads this file automatically next to docker-compose.yaml.
services:
  weather-db:
    image: postgres:13
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      # host port 5433 -> container port 5432 (5433 avoids clashing with a local Postgres)
      - "5433:5432"
    volumes:
      - weather-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weather"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

volumes:
  weather-db-volume: